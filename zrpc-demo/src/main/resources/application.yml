zrpc:
  registry:
    type: zookeeper
    address: 127.0.0.1:21888
  serialization:
    default-type: protobuf
  load-balance:
    strategy: consistenthash
  server:
    host: 127.0.0.1
    port: 9999
    version: gray
    gray: true
  client:
    request-timeout-millis: 5000
  ratelimit:
    default_algorithm: token_bucket
    token_bucket:
      qps: 5000
      capacity: 10000
  bulkhead:
    default:
      max_concurrent: 500
    services:
      "cn.wenyuan.zrpc.demo.api.GreetingService":
        sum:
          max_concurrent: 5000
  circuit-breaker:
    failure-rate-threshold: 50
    slow-call-rate-threshold: 100
    slow-call-duration-ms: 2000
    wait-duration-ms: 5000
    sliding-window-size: 10
    minimum-number-of-calls: 5
    permitted-calls-in-half-open: 2
  tracing:
    enabled: true
    service-name: zrpc-demo
    zipkin-url: http://localhost:9411/api/v2/spans
    sampler-rate: 1.0
  retry:
    enabled: true
    max-attempts: 3
    initial-delay-ms: 100
    backoff-multiplier: 2.0
    retry-on: NETWORK_AND_SERVER_BUSY
  gray-release:
    enabled: true
    target-version: gray
    force-header: gray-tag
    identity-header: user-id
    whitelist:
      - vip-user
    percentage: 20
